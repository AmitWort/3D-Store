<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Store - האתר בתחזוקה</title>
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="apple-touch-icon" href="images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

<body>
  <header class="site-header">
    <a class="site-title" href="maintenance.html">

  <main>

      <p style="font-size:1.15rem; font-weight:700; margin:0 0 8px;">נחזור בקרוב, תודה!</p>
      <p style="color:var(--color-muted); margin:0;">אנחנו מבצעים כרגע עדכון קטן בחנות. אפשר לחזור לבקר עוד מעט.</p>
    </div>

  <footer>
    <a href="admin.html">כניסת בעל החנות</a>
